version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: smartcare_postgres
    restart: always
    environment:
      POSTGRES_USER: smartcare
      POSTGRES_PASSWORD: smartcare_password_2026
      POSTGRES_DB: smartcare_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartcare -d smartcare_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
